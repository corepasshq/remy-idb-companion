name: Build patched idb companion

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen protobuf swift-protobuf
          tmp="$RUNNER_TEMP/grpc-codegen.zip"
          curl -L --fail --retry 3 \
            -o "$tmp" \
            https://github.com/grpc/grpc-swift/releases/download/1.23.1/protoc-grpc-swift-plugins-1.23.1.zip
          test "$(shasum -a 256 "$tmp" | awk '{print $1}')" = \
            1cf5150471ee1bc527c5baaee4ceca9f3a8b2aa7ee0ae32a4ab6bff0c86d5934
          unzip -q "$tmp" -d "$RUNNER_TEMP/grpc-codegen"
          sudo install -m 0755 \
            "$(find "$RUNNER_TEMP/grpc-codegen" -type f -name protoc-gen-grpc-swift -print -quit)" \
            /usr/local/bin/protoc-gen-grpc-swift
          protoc-gen-grpc-swift --version | grep -F '1.23.1'

          # idb's `build.sh` pipes xcodebuild through `xcpretty` whenever it is
          # on PATH, and xcpretty no longer parses modern xcodebuild output: a
          # failed build reports `** BUILD FAILED **` with every `error:` line
          # swallowed, which is exactly what the first run of this workflow
          # produced. The runner is ephemeral and nothing else here wants a
          # pretty printer, so the shim is removed to keep raw diagnostics.
          sudo rm -f "$(command -v xcpretty || true)"

      - name: Report the toolchain this build actually used
        shell: bash
        run: |
          set -euo pipefail
          # The manifest RECORDS these versions; brew installs whatever is
          # current. They are printed rather than enforced, so a build whose
          # bytes differ from a previous one has a readable reason.
          xcodebuild -version | head -1
          xcodegen --version
          protoc --version
          protoc-gen-swift --version

      - name: Build patched companion
        run: node scripts/build-patched-idb-companion.mjs build/idb-patched

      - name: Verify and pack
        shell: bash
        run: |
          set -euo pipefail
          test -x build/idb-patched/idb_companion
          # `test` does not glob, so `= *arm64*` would compare against a
          # literal asterisk string and could never pass.
          file build/idb-patched/idb_companion | grep -q 'arm64'
          build/idb-patched/idb_companion --version
          codesign --verify --verbose=4 build/idb-patched/idb_companion
          # Pack the binary BY NAME, never `-C dir .`: that form emits `./`,
          # `./idb_companion` and `./manifest.json`, and the consumer
          # (Remy's `desktop/scripts/fetch-idb-companion.mjs`, `WANTED`)
          # refuses an archive carrying any member it did not ask for.
          tar czf idb-companion.macos-arm64.tar.gz -C build/idb-patched idb_companion
          shasum -a 256 idb-companion.macos-arm64.tar.gz \
            > idb-companion.macos-arm64.tar.gz.sha256
          echo "--- paste this digest into Remy's idb-patched-manifest.json"
          cat idb-companion.macos-arm64.tar.gz.sha256

      # Kept for a push-triggered build, which verifies but does not publish.
      - uses: actions/upload-artifact@v6
        with:
          name: idb-companion-macos-arm64
          path: |
            idb-companion.macos-arm64.tar.gz
            idb-companion.macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      # Publishing is a deliberate act, so it runs only for a manual dispatch:
      # editing a patch gets you a verified build, never a silent release.
      - name: Publish immutable release asset
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag is read from the manifest rather than written twice: the
          # consumer pins `asset.tag`, so the manifest is the only authority.
          tag="$(node -p "require('./scripts/idb-patched-manifest.json').asset.tag")"
          upstream="$(node -p "require('./scripts/idb-patched-manifest.json').upstream.tag")"
          # A published tag is immutable on purpose: Remy pins the archive's
          # sha256, which only means anything if the bytes never change. To ship
          # a new patch set, bump `name` and `asset.tag` in the manifest.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; bump asset.tag in the manifest" >&2
            exit 1
          fi
          gh release create "$tag" \
            idb-companion.macos-arm64.tar.gz \
            idb-companion.macos-arm64.tar.gz.sha256 \
            --title "$tag" \
            --notes "Patched facebook/idb $upstream companion for Remy's iOS simulator panel, macOS arm64. Built by .github/workflows/build.yml from the patches in scripts/idb-patches/."
